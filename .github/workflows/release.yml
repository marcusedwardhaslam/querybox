name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: querybox-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Build app bundle
        run: |
          cargo bundle --release
          test -d "target/release/bundle/osx/QueryBox.app" || (echo "App bundle not found" && exit 1)

      - name: Create DMG
        run: |
          hdiutil create \
            -volname QueryBox \
            -srcfolder "target/release/bundle/osx/QueryBox.app" \
            -ov \
            -format UDZO \
            ${{ matrix.artifact }}.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.dmg
          generate_release_notes: true
